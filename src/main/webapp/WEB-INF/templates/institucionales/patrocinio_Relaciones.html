<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrocinio</title>
    <link rel="stylesheet" th:href="@{/CSS/generalRelaciones.css}">
</head>
<body>
<header>
    <h1>Patrocinio</h1>
    <a th:href="@{/relaciones}">
        <button type="button">&#8592; Atrás</button>
    </a>
</header>

<main>
    <table border="1">
        <thead>
        <tr>
            <th>ID Colaboración</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Firma</th>
            <th>Dinero</th>
            <th>Convenio</th>
            <th>ID Historial</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="col : ${colaboraciones}">
            <td th:text="${col.idColaboracion}">1</td>
            <td th:text="${col.tipo}">Bronce</td>
            <td th:text="${col.fecha != null ? col.fecha : '---'}">2026-06-18</td>
            <td th:text="${col.firma ? 'Sí' : 'No'}">Sí</td>
            <td th:text="${col.dinero}">3000</td>
            <td th:text="${col.convenio}">Convenio Standard</td>
            <td th:text="${col.idHistorial != null ? col.idHistorial.idHistorial : '---'}">1</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
