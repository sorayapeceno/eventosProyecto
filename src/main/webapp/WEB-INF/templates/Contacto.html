<!DOCTYPE html>
<html lang="ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.E.S. Torre de los Guzmanes - Contacto</title>
    <link rel="stylesheet" href="../../CSS/Contacto.css"></head>

<body>

    <header>
        <div class="logo-container">
            <img id="logo" src="../../Fotos/logo.svg" alt="Logo IES Torre de los Guzmanes">        </div>
        <h1>I.E.S. Torre de los Guzmanes</h1>
        <div class="contenedorBotonInicio">
            <a href="crm/index.html" class="boton-inicio">INICIO</a>
        </div>
    </header>

    <main class="contenedor-contacto">
        
        <section class="seccion-formulario">
            <h2>Envíanos un mensaje</h2>
            <form action="#" method="POST">
                <div class="grupo-formulario">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellidos" required>
                </div>

                <div class="grupo-formulario">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="grupo-formulario">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de la consulta" required>
                </div>

                <div class="grupo-formulario">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí tu mensaje..." required></textarea>
                </div>

                <button type="submit" class="boton-enviar">Enviar Mensaje</button>
            </form>
        </section>

        <section class="seccion-informacion">
            <h2>Datos de Contacto</h2>
            
            <div class="datos-lista">
                <p><strong>📍 Dirección:</strong> C. Sánchez Cotán, 15, 41980 La Algaba, Sevilla</p>
                <p><strong>📞 Teléfono:</strong> 671 53 91 08</p>
                <p><strong>✉️ Email:</strong> 41700968.administracion.edu@juntadeandalucia.es</p>
                <p><strong>⏰ Horario:</strong> Lunes a Viernes de 8:00 a 14:30</p>
            </div>

            <div class="contenedor-mapa">
                <h3>Nuestra Ubicación</h3>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3167.3379659021873!2d-6.0150!3d37.46!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDI3JzM2LjAiTiA2wrAwMCc1NC4wIlc!5e0!3m2!1ses!2ses!4v1620000000000!5m2!1ses!2ses" 
                    width="100%" 
                    height="200" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </section>

    </main>

</body>
</html>
