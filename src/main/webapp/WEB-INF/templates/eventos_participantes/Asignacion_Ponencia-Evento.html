<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Asignar Ponencia a Evento</title>
        <!--Estilo Lili-->
        <link rel="stylesheet" href="/css/modulo1.css">
    </head>
    <body>
        <header>
            <h1>Gestión de Eventos Educativos</h1>
            <nav>
                <ul>
                    <li><a href="/html/Listado_Eventos.html">Eventos</a></li>
                    <li><a href="/html/Listado_Ponencias.html">Ponencias</a></li>
                    <li><a href="/html/Listado_Ponentes.html">Ponentes</a></li>
                </ul>
            </nav>
        </header>
        <aside>
            <h2>Opciones</h2>
            <ul>
                <li><a href="/html/Listado_Ponencias.html">Listado de ponencias</a></li>
                <li><a href="/html/Crear_Ponencia.html">Crear ponencia</a></li>
                <li><a href="/html/Asignacion_Ponencia-Evento.html">Asignar ponencia a evento</a></li>
            </ul>
        </aside>
        <main>
            <section class="contenido-secundario">
                <h2>Asignar ponencia a evento</h2>

                <form action="#" method="post" th:object="${asignacion}">
                    <fieldset>
                        <legend>Datos de asignación</legend>

                        <!-- EVENTO -->
                        <label for="evento">Selecciona un evento:</label>
                        <select id="evento" name="evento">
                            <option value="">Elige una opción:</option>
                            <option th:each="evento : ${eventos}" th:value="${evento.id}" th:text="${evento.nombre}"></option>
                        </select>

                        <!-- PONENCIA -->
                        <label for="ponencia">Selecciona una ponencia:</label>
                        <select id="ponencia" name="ponencia">
                            <option value="">Elige una opción:</option>
                            <option th:each="ponencia : ${ponencias}" th:value="${ponencia.id}" th:text="${ponencia.titulo}">
                            </option>
                        </select>

                        <button type="submit">Asignar ponencia</button>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer>
            <p>© 2026 Gestión de Eventos Educativos</p>
        </footer>
    </body>
</html>
