<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Crear Evento</title>
        <!--Estilo Lili-->
        <link rel="stylesheet" href="">
    </head>

    <body>
        <header>
            <h1>Gestión de Eventos Educativos</h1>
            <nav>
                <ul>
                    <li><a href="/html/Listado_Eventos.html">Eventos</a></li>
                    <li><a href="/html/Listado_Ponencias.html">Ponencias</a></li>
                    <li><a href="/html/Listado_Ponentes.html">Ponentes</a></li>
                </ul>
            </nav>
        </header>

        <aside>
            <h2>Opciones</h2>
            <ul>
                <li><a href="/html/Listado_Eventos.html">Listado de eventos</a></li>
                <li><a href="/html/Crear_Evento.html">Crear evento</a></li>
            </ul>
        </aside>

        <main>
            <section>
                <h2>Crear nuevo evento</h2>

                <form action="#" method="post">
                    <fieldset>
                        <legend>Datos del evento</legend>

                        <label for="nombre">Nombre del evento:</label>
                        <input type="text" id="nombre" name="nombre" required>

                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4"></textarea>

                        <label for="fechaInicio">Fecha de inicio:</label>
                        <input type="date" id="fechaInicio" name="fechaInicio" required>

                        <label for="fechaFin">Fecha de fin:</label>
                        <input type="date" id="fechaFin" name="fechaFin" required>

                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion" required>

                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" required>

                        <label for="capacidad">Capacidad:</label>
                        <input type="number" id="capacidad" name="capacidad" required>

                        <label for="estado">Estado:</label>
                        <select id="estado" name="estado">
                            <option value="Borrador">Borrador</option>
                            <option value="Abierto">Abierto</option>
                            <option value="Cerrado">Cerrado</option>
                            <option value="Postpuesto">Postpuesto</option>
                            <option value="Cancelado">Cancelado</option>
                        </select>

                        <label for="modalidad">Modalidad:</label>
                        <select id="modalidad" name="modalidad">
                            <option value="Presencial">Presencial</option>
                            <option value="Híbrido">Híbrido</option>
                            <option value="Online">Online</option>
                        </select>

                        <label for="lugar">Lugar:</label>
                        <input type="text" id="lugar" name="lugar" required>

                        <button type="submit">Crear evento</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer>
            <p>© 2026 Gestión de Eventos</p>
        </footer>
    </body>
</html>
