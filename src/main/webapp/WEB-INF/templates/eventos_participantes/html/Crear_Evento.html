<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Crear Evento</title>
        <!--Estilo Lili-->
        <link rel="stylesheet" href="/css/modulo1.css">
    </head>
    <body>
    <header>
        <h1>Gestión de Eventos Educativos</h1>
        <nav>
            <ul>
                <li><a href="/html/Listado_Eventos.html">Eventos</a></li>
                <li><a href="/html/Listado_Ponencias.html">Ponencias</a></li>
                <li><a href="/html/Listado_Ponentes.html">Ponentes</a></li>
            </ul>
        </nav>
    </header>

    <aside>
        <h2>Opciones</h2>
        <ul>
            <li><a href="/html/Listado_Eventos.html">Listado de eventos</a></li>
            <li><a href="/html/Crear_Evento.html">Crear evento</a></li>
        </ul>
    </aside>
        <main>
            <section class="contenido-secundario">
                <h2>Crear nuevo evento</h2>
                <form action="#" method="post" th:object="${evento}">
                    <fieldset>
                        <legend>Datos del evento</legend>

                        <label for="nombre">Nombre del evento:</label>
                        <input type="text" id="nombre" name="nombre" th:value="${evento.nombre}" required>

                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" th:text="${evento.descripcion}" rows="4"></textarea>

                        <label for="fechaInicio">Fecha de inicio:</label>
                        <input type="date" id="fechaInicio" name="fechaInicio" th:value="${evento.fechaInicio}" required>

                        <label for="fechaFin">Fecha de fin:</label>
                        <input type="date" id="fechaFin" name="fechaFin" th:value="${evento.fechaFin}" required>

                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion" th:value="${evento.direccion}" required>

                        <label for="ciudad">Ciudad:</label>
                        <input type="text" id="ciudad" name="ciudad" th:value="${evento.ciudad}" required>

                        <label for="capacidad">Capacidad:</label>
                        <input type="number" id="capacidad" name="capacidad" th:value="${evento.capacidad}" required>

                        <!-- ESTADO DINÁMICO -->
                        <label for="estado">Estado:</label>
                        <select id="estado" name="estado">
                            <option value="">Elige una opción:</option>
                            <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                        </select>

                        <!-- MODALIDAD DINÁMICA -->
                        <label for="modalidad">Modalidad:</label>
                        <select id="modalidad" name="modalidad">
                            <option value="">Elige una opción:</option>
                            <option th:each="modalidad : ${modalidades}" th:value="${modalidad}" th:text="${modalidad}"></option>
                        </select>

                        <label for="lugar">Lugar:</label>
                        <input type="text" id="lugar" name="lugar" th:value="${evento.lugar}" required>

                        <button type="submit">Crear evento</button>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer>
            <p>© 2026 Gestión de Eventos</p>
        </footer>
    </body>
</html>
