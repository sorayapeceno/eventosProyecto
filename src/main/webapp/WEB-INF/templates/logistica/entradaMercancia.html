<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrada de Mercancía</title>

    <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        form {
            background: #f4f4f4;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px;
            width: 100%;
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #34495e;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Entrada de Mercancía</h1>
    <div class="cajaDeBotones">

        <a class="botones" th:href="@{/logistica}">
            Logística
        </a>

    </div>
</header>

<div class="contenedor">

    <form action="#" method="post">

        <label>ID Mercancía:</label>
        <input type="number" name="idMercancia" required>

        <label>Cantidad a añadir:</label>
        <input type="number" name="cantidad" required>

        <button type="submit">Registrar entrada</button>

    </form>

</div>

<div th:if="${error}" style="background-color: #fdf7f7; border: 1px solid #d9534f; border-radius: 4px; padding: 15px; margin-bottom: 20px;">
    <h3 style="color: #d9534f; margin: 0; font-size: 1.1em;" th:text="${error}"></h3>
</div>
</body>
</html>
