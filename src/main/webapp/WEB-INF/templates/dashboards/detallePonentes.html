<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Detalle – Ponentes</title>
    <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">
    <link rel="stylesheet" th:href="@{/CSS/dashboards.css}">
</head>
<body>
<header>
    <div class="header-superior">
        <div class="logo-container">
            <a href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" target="_blank">
                <img th:src="@{/Fotos/logo.svg}" alt="Logotipo Instituto" id="logo">
            </a>
        </div>
        <h1>Detalle – Ponentes</h1>
        <div class="contenedorBotonInicio">
            <a th:href="@{/dashboards/ponentes}"><button type="button">&#8592; Atrás</button></a>
        </div>
    </div>
    <div class="cajaDeBotones">
        <a class="botones" th:href="@{/dashboards/eventos}">Eventos</a>
        <a class="botones" th:href="@{/dashboards/ponencias}">Ponencias</a>
        <a class="botones" th:href="@{/dashboards/ponentes}">Ponentes</a>
        <a class="botones" th:href="@{/dashboards/ventas}">Ventas</a>
    </div>
</header>
<main class="principal">
    <div class="dashboard-contenido">

        <div class="charts-grid">
            <div class="chart-box">
                <h3>Por Especialidad</h3>
                <canvas id="chartEspecialidad"></canvas>
            </div>
            <div class="chart-box">
                <h3>Por Nivel de Impartición</h3>
                <canvas id="chartNivelImparticion"></canvas>
            </div>
        </div>

        <div class="tabla-detalle-wrap">
            <h2 class="tabla-titulo">Listado completo de Ponentes</h2>
            <table class="tabla-detalle">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>Nivel Impartición</th>
                    <th>Nº Ponencias</th>
                    <th>Correo</th>
                    <th>Ciudad</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${ponentes}">
                    <td th:text="${p['Nombre']}"></td>
                    <td th:text="${p['Especialidad']}"></td>
                    <td th:text="${p['Nivel_Imparticion']}"></td>
                    <td th:text="${p['Ponencias']}"></td>
                    <td th:text="${p['Correo']}"></td>
                    <td th:text="${p['Ciudad']}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>
<footer><p>© 2026 Gestión de Eventos</p></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    const nivValues = /*[[${ponentesPorNivelImparticion.values()}]]*/ [];

</script>
<script th:src="@{/JS/detallePonentes.js}"></script>
</body>
</html>
