<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Detalle – Eventos</title>
    <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">
    <link rel="stylesheet" th:href="@{/CSS/dashboards.css}">
</head>
<body>
<header>
    <div class="header-superior">
        <div class="logo-container">
            <a href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" target="_blank">
                <img th:src="@{/Fotos/logo.svg}" alt="Logotipo Instituto" id="logo">
            </a>
        </div>
        <h1>Detalle – Eventos</h1>
        <div class="contenedorBotonInicio">
            <a th:href="@{/dashboards/eventos}"><button type="button">&#8592; Atrás</button></a>
        </div>
    </div>
    <div class="cajaDeBotones">
        <a class="botones" th:href="@{/dashboards/eventos}">Eventos</a>
        <a class="botones" th:href="@{/dashboards/ponencias}">Ponencias</a>
        <a class="botones" th:href="@{/dashboards/ponentes}">Ponentes</a>
        <a class="botones" th:href="@{/dashboards/ventas}">Ventas</a>
    </div>
</header>
<main class="principal">
    <div class="dashboard-contenido">

        <!-- Gráficas resumidas arriba -->
        <div class="charts-grid">
            <div class="chart-box">
                <h3>Por Estado</h3>
                <canvas id="chartEstado"></canvas>
            </div>
            <div class="chart-box">
                <h3>Por Modalidad</h3>
                <canvas id="chartModalidad"></canvas>
            </div>
        </div>

        <!-- Tabla detallada -->
        <div class="tabla-detalle-wrap">
            <h2 class="tabla-titulo">Listado completo de Eventos</h2>
            <table class="tabla-detalle">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Ciudad</th>
                    <th>Estado</th>
                    <th>Modalidad</th>
                    <th>Capacidad</th>
                    <th>Lugar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${eventos}">
                    <td th:text="${e['Nombre']}"></td>
                    <td th:text="${e['Fecha_Inicio']}"></td>
                    <td th:text="${e['Fecha_Fin']}"></td>
                    <td th:text="${e['Ciudad']}"></td>
                    <td><span class="badge" th:text="${e['Estado']}"></span></td>
                    <td th:text="${e['Modalidad']}"></td>
                    <td th:text="${e['Capacidad']}"></td>
                    <td th:text="${e['Lugar']}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>
<footer><p>© 2026 Gestión de Eventos</p></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const estadoLabels = /*[[${eventosPorEstado.keySet()}]]*/ [];
    const estadoValues = /*[[${eventosPorEstado.values()}]]*/ [];
    const modalLabels  = /*[[${eventosPorModalidad.keySet()}]]*/ [];
    const modalValues  = /*[[${eventosPorModalidad.values()}]]*/ [];
    /*]]>*/
</script>
<script th:src="@{/JS/dashboardEventos.js}"></script>
</body>
</html>
