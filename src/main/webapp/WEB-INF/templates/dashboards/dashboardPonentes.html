<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard – Ponentes</title>
  <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">
  <link rel="stylesheet" th:href="@{/CSS/dashboards.css}">
</head>
<body>
<header>
  <div class="header-superior">
    <div class="logo-container">
      <a href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" target="_blank">
        <img th:src="@{/Fotos/logo.svg}" alt="Logotipo Instituto" id="logo">
      </a>
    </div>
    <h1>Dashboard – Ponentes</h1>
    <div class="contenedorBotonInicio">
      <a th:href="@{/dashboards}"><button type="button">&#8592; Atrás</button></a>
    </div>
  </div>
  <div class="cajaDeBotones">
    <a class="botones" th:href="@{/dashboards/eventos}">Eventos</a>
    <a class="botones" th:href="@{/dashboards/ponencias}">Ponencias</a>
    <a class="botones" th:href="@{/dashboards/ponentes}">Ponentes</a>
    <a class="botones" th:href="@{/dashboards/ventas}">Ventas</a>
  </div>
</header>
<main class="principal">
  <div class="dashboard-contenido">
    <div class="kpi-row">
      <div class="kpi">
        <div class="num" th:text="${totalPonentes}">0</div>
        <div class="lbl">Ponentes registrados</div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="chart-box">
        <h3>Por Especialidad</h3>
        <canvas id="chartEspecialidad"></canvas>
      </div>
      <div class="chart-box">
        <h3>Por Nivel de Impartición</h3>
        <canvas id="chartNivelImparticion"></canvas>
      </div>
      <div class="chart-box wide">
        <h3>Top Ponentes por nº de Ponencias</h3>
        <canvas id="chartTop"></canvas>
      </div>
    </div>
    <div class="mas-info-row">
      <a class="btn-mas-info" th:href="@{/dashboards/ponentes/detalle}">
        &#128269; Más información
      </a>
    </div>
  </div>
</main>
<footer><p>© 2026 Gestión de Eventos</p></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  const espLabels = /*[[${ponentesPorEspecialidad.keySet()}]]*/ [];
  const espValues = /*[[${ponentesPorEspecialidad.values()}]]*/ [];
  const nivLabels = /*[[${ponentesPorNivelImparticion.keySet()}]]*/ [];
  const nivValues = /*[[${ponentesPorNivelImparticion.values()}]]*/ [];
  const topLabels = /*[[${topPonentes.keySet()}]]*/ [];
  const topValues = /*[[${topPonentes.values()}]]*/ [];
  /*]]>*/
</script>
<script th:src="@{/JS/dashboardPonentes.js}"></script>
</body>
</html>
