<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard – Eventos</title>
  <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">
  <link rel="stylesheet" th:href="@{/CSS/dashboards.css}">
</head>
<body>
<header>
  <div class="header-superior">
    <div class="logo-container">
      <a href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" target="_blank">
        <img th:src="@{/Fotos/logo.svg}" alt="Logotipo Instituto" id="logo">
      </a>
    </div>
    <h1>Dashboard – Eventos</h1>
    <div class="contenedorBotonInicio">
      <a th:href="@{/dashboards}"><button type="button">&#8592; Atrás</button></a>
    </div>
  </div>
  <div class="cajaDeBotones">
    <a class="botones" th:href="@{/dashboards/eventos}">Eventos</a>
    <a class="botones" th:href="@{/dashboards/ponencias}">Ponencias</a>
    <a class="botones" th:href="@{/dashboards/ponentes}">Ponentes</a>
    <a class="botones" th:href="@{/dashboards/ventas}">Ventas</a>
  </div>
</header>
<main class="principal">
  <div class="dashboard-contenido">
    <div class="kpi-row">
      <div class="kpi">
        <div class="num" th:text="${totalEventos}">0</div>
        <div class="lbl">Eventos registrados</div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="chart-box">
        <h3>Eventos por Estado</h3>
        <canvas id="chartEstado"></canvas>
      </div>
      <div class="chart-box">
        <h3>Eventos por Modalidad</h3>
        <canvas id="chartModalidad"></canvas>
      </div>
      <div class="chart-box">
        <h3>Eventos por Ciudad</h3>
        <canvas id="chartCiudad"></canvas>
      </div>
    </div>
    <div class="mas-info-row">
      <a class="btn-mas-info" th:href="@{/dashboards/eventos/detalle}">
        &#128269; Más información
      </a>
    </div>
  </div>
</main>
<footer><p>© 2026 Gestión de Eventos</p></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
  /*<![CDATA[*/
  const estadoLabels = /*[[${eventosPorEstado.keySet()}]]*/ [];
  const estadoValues = /*[[${eventosPorEstado.values()}]]*/ [];
  const modalLabels  = /*[[${eventosPorModalidad.keySet()}]]*/ [];
  const modalValues  = /*[[${eventosPorModalidad.values()}]]*/ [];
  const ciudadLabels = /*[[${eventosPorCiudad.keySet()}]]*/ [];
  const ciudadValues = /*[[${eventosPorCiudad.values()}]]*/ [];
  /*]]>*/
</script>
<script th:src="@{/JS/dashboardEventos.js}"></script>
</body>
</html>
