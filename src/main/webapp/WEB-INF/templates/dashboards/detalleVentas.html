<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Detalle – Participantes</title>
    <link rel="stylesheet" th:href="@{/CSS/PaginaBase.css}">
    <link rel="stylesheet" th:href="@{/CSS/dashboards.css}">
</head>
<body>
<header>
    <div class="header-superior">
        <div class="logo-container">
            <a href="https://blogsaverroes.juntadeandalucia.es/iestorrredelosguzmanes/" target="_blank">
                <img th:src="@{/Fotos/logo.svg}" alt="Logotipo Instituto" id="logo">
            </a>
        </div>
        <h1>Detalle – Participantes</h1>
        <div class="contenedorBotonInicio">
            <a th:href="@{/dashboards/ventas}"><button type="button">&#8592; Atrás</button></a>
        </div>
    </div>
    <div class="cajaDeBotones">
        <a class="botones" th:href="@{/dashboards/eventos}">Eventos</a>
        <a class="botones" th:href="@{/dashboards/ponencias}">Ponencias</a>
        <a class="botones" th:href="@{/dashboards/ponentes}">Ponentes</a>
        <a class="botones" th:href="@{/dashboards/ventas}">Ventas</a>
    </div>
</header>
<main class="principal">
    <div class="dashboard-contenido">

        <div class="charts-grid">
            <div class="chart-box wide">
                <h3>Participantes por Ciudad</h3>
                <canvas id="chartCiudad"></canvas>
            </div>
        </div>

        <div class="tabla-detalle-wrap">
            <h2 class="tabla-titulo">Listado completo de Participantes</h2>
            <table class="tabla-detalle">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Ciudad</th>
                    <th>País</th>
                    <th>Género</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${participantes}">
                    <td th:text="${p['Nombre']}"></td>
                    <td th:text="${p['Correo']}"></td>
                    <td th:text="${p['Telefono']}"></td>
                    <td th:text="${p['Ciudad']}"></td>
                    <td th:text="${p['Pais']}"></td>
                    <td th:text="${p['Genero']}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>
<footer><p>© 2026 Gestión de Eventos</p></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const ciudadLabels = /*[[${clientesPorCiudad.keySet()}]]*/ [];
    const ciudadValues = /*[[${clientesPorCiudad.values()}]]*/ [];
    /*]]>*/
</script>
<script th:src="@{/JS/dashboardVentas.js}"></script>
</body>
</html>
